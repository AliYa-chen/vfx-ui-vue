name: Check docs build

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/vue/**"
      - "packages/core/**"
      - "registry/**"
      - "scripts/generate-agentic.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/vue/**"
      - "packages/core/**"
      - "registry/**"
      - "scripts/generate-agentic.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm run build

      # Cloudflare Pages builds and deploys main through its GitHub integration.
      # This workflow checks the same build without requiring deployment secrets.
